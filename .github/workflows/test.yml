name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: make check
      - uses: wtfjoke/setup-tectonic@v4.0.5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: make paper
